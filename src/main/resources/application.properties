spring.application.name=chamados-api
server.port=${SERVER_PORT:8081}

# Banco próprio da atividade, separado do login-java e do ThinDesk.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27019/chamados_api}
spring.data.mongodb.database=${MONGODB_DATABASE:chamados_api}
spring.data.mongodb.auto-index-creation=true

# Mantém a persistência de sessões da base reaproveitada.
spring.session.store-type=mongodb
spring.session.timeout=${SESSION_TIMEOUT:30m}
spring.session.mongodb.collection-name=sessions

# A senha inicial é fornecida pelo ambiente, sem valor padrão.
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD}
app.admin.email=${APP_ADMIN_EMAIL:admin@local}
app.admin.nome=${APP_ADMIN_NOME:Administrador}

app.recovery.token-minutos=60
app.login.max-tentativas=5
app.login.bloqueio-minutos=15

server.error.include-message=never
server.error.include-stacktrace=never
logging.level.com.example.chamados=INFO
